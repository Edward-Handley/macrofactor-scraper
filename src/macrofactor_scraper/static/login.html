<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Health Export Login</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f6f8;
        color: #17202a;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(92vw, 360px);
        background: #ffffff;
        border: 1px solid #d7dde3;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 16px 48px rgba(23, 32, 42, 0.08);
      }
      h1 {
        margin: 0 0 18px;
        font-size: 1.35rem;
        line-height: 1.2;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.9rem;
        font-weight: 650;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        height: 42px;
        border: 1px solid #aab4be;
        border-radius: 6px;
        padding: 0 12px;
        font: inherit;
      }
      button {
        width: 100%;
        height: 42px;
        margin-top: 16px;
        border: 0;
        border-radius: 6px;
        background: #0f766e;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .error {
        min-height: 20px;
        margin: 12px 0 0;
        color: #b42318;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Health Export</h1>
      <form method="post" action="/login">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" autofocus>
        <button type="submit">Sign in</button>
        <p class="error">{{ error }}</p>
      </form>
    </main>
  </body>
</html>
