<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Health Export Dashboard</title>
    <style>
      body {
        margin: 0;
        display: grid;
        min-height: 100vh;
        place-items: center;
        background: #f3f6f8;
        color: #17202a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(560px, calc(100vw - 32px));
        border: 1px solid #d7dde3;
        border-radius: 8px;
        background: #ffffff;
        padding: 22px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.2rem;
      }
      p {
        margin: 0;
        color: #5f6c78;
        line-height: 1.5;
      }
      code {
        color: #0f766e;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dashboard assets are not built</h1>
      <p>Run <code>npm install</code> and <code>npm run build</code> from <code>frontend/</code>, then reload this page.</p>
    </main>
  </body>
</html>
